<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>수학 레벨업 대모험</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Gaegu:wght@700&family=Single+Day&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#fff7e0; --night:#171241; --violet:#3b2a8a; --panel:#221a57; --gold:#ffc93c; --mint:#46e0b0; --coral:#ff5d73; --sky:#5cc8ff;
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --display:'Black Han Sans','Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#fff7e0; --night:#171241; --panel:#221a57; } }
:root[data-theme="dark"]{ --ink:#fff7e0; --night:#171241; --panel:#221a57; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:#0d0a2e}
body{margin:0;height:100%;background:#0d0a2e;color:var(--ink);font-family:var(--font);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#cv{position:absolute;inset:0;display:block}
.hidden{display:none!important}
button{font-family:var(--font);cursor:pointer;border:0;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- 3D chunky buttons ---------- */
.btn{background:linear-gradient(#ffd966,#ffb300);color:#4a2500;font-size:20px;padding:12px 22px;border-radius:16px;box-shadow:0 5px 0 #b86b00,0 8px 18px rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b86b00}
.btn.blue{background:linear-gradient(#7fdcff,#2f9bff);color:#06224a;box-shadow:0 5px 0 #1a5fb0,0 8px 18px rgba(0,0,0,.35)}
.btn.green{background:linear-gradient(#8ff5c9,#27c28a);color:#053b26;box-shadow:0 5px 0 #138a5e,0 8px 18px rgba(0,0,0,.35)}
.btn.red{background:linear-gradient(#ff9aa8,#ff4d67);color:#4a0612;box-shadow:0 5px 0 #b3203a,0 8px 18px rgba(0,0,0,.35)}
.btn.gray{background:linear-gradient(#cfd3e6,#8f95b5);color:#1d2140;box-shadow:0 5px 0 #5c6286}
.btn.sm{font-size:15px;padding:7px 12px;border-radius:12px;box-shadow:0 3px 0 #b86b00}
.btn.sm.blue{box-shadow:0 3px 0 #1a5fb0}.btn.sm.green{box-shadow:0 3px 0 #138a5e}.btn.sm.red{box-shadow:0 3px 0 #b3203a}.btn.sm.gray{box-shadow:0 3px 0 #5c6286}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}

/* ---------- Title ---------- */
.screen{position:absolute;inset:0;z-index:10}
#title{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);padding:16px;text-align:center}
.logo{position:relative;line-height:.95}
.logo .row{display:flex;justify-content:center;flex-wrap:nowrap}
.logo .ch{display:inline-block;animation:drop .9s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*.07s)}
.logo .ch>span{display:inline-block;animation:bob 2.6s ease-in-out infinite;animation-delay:calc(var(--i)*.12s + 1s)}
.l1 .ch>span{font-family:var(--display);font-size:clamp(40px,9.5vw,104px);background:linear-gradient(180deg,#fffbe0 0%,#ffe066 38%,#ffab1a 62%,#ff7a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #6b2f00;filter:drop-shadow(0 5px 0 #6b2f00) drop-shadow(0 0 22px rgba(255,190,60,.6));padding:0 .02em}
.l2 .ch>span{font-family:var(--display);font-size:clamp(52px,13vw,150px);background:linear-gradient(180deg,#ffffff 0%,#b6f3ff 40%,#4fb8ff 70%,#7a5cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2.5px #1d1260;filter:drop-shadow(0 6px 0 #1d1260) drop-shadow(0 0 30px rgba(120,200,255,.75));padding:0 .02em}
.logo .tag{margin-top:10px;font-size:clamp(14px,2.4vw,20px);color:#ffe9b0;letter-spacing:.08em;opacity:0;animation:fadein .8s 1.3s forwards;text-shadow:0 2px 8px #000}
.logo::before{content:"";position:absolute;left:50%;top:50%;width:140%;height:190%;transform:translate(-50%,-50%);background:conic-gradient(from 0deg,transparent 0 10deg,rgba(255,220,120,.14) 10deg 20deg,transparent 20deg 40deg,rgba(255,220,120,.14) 40deg 50deg,transparent 50deg 70deg,rgba(255,220,120,.14) 70deg 80deg,transparent 80deg 100deg,rgba(255,220,120,.14) 100deg 110deg,transparent 110deg 130deg,rgba(255,220,120,.14) 130deg 140deg,transparent 140deg 160deg,rgba(255,220,120,.14) 160deg 170deg,transparent 170deg 190deg,rgba(255,220,120,.14) 190deg 200deg,transparent 200deg 220deg,rgba(255,220,120,.14) 220deg 230deg,transparent 230deg 250deg,rgba(255,220,120,.14) 250deg 260deg,transparent 260deg 280deg,rgba(255,220,120,.14) 280deg 290deg,transparent 290deg 310deg,rgba(255,220,120,.14) 310deg 320deg,transparent 320deg 340deg,rgba(255,220,120,.14) 340deg 350deg,transparent 350deg);border-radius:50%;animation:spin 24s linear infinite;z-index:-1;-webkit-mask:radial-gradient(closest-side,#000 30%,transparent 100%);mask:radial-gradient(closest-side,#000 30%,transparent 100%)}
@keyframes drop{0%{transform:translateY(-140px) scale(.2) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadein{to{opacity:1}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 #b86b00,0 0 0 0 rgba(255,201,60,.7)}50%{box-shadow:0 6px 0 #b86b00,0 0 0 18px rgba(255,201,60,0)}}
.grades{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fadein .6s 1.5s forwards}
.grades .lbl{width:100%;font-size:16px;color:#ffe9b0;text-shadow:0 2px 6px #000}
.gbtn{min-width:64px;padding:10px 12px;border-radius:14px;font-size:18px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(4px)}
.gbtn.on{background:linear-gradient(#7fdcff,#2f9bff);border-color:#fff;color:#06224a;transform:scale(1.08);box-shadow:0 0 18px rgba(80,180,255,.8)}
.tbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;animation:fadein .6s 1.8s forwards}
#bStart{font-size:clamp(22px,4vw,30px);padding:14px 36px;animation:pulse 1.8s infinite}
.hint{font-size:13px;opacity:.75;text-shadow:0 1px 4px #000}

/* ---------- Map ---------- */
#map{overflow-y:auto;background:linear-gradient(180deg,rgba(13,10,46,.55),rgba(13,10,46,.9));padding:12px 12px 40px;touch-action:pan-y}
.mapTop{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;background:rgba(20,14,60,.78);border:2px solid rgba(255,255,255,.2);font-size:16px;white-space:nowrap}
.chip.pts{background:linear-gradient(#ffe57a,#ffb300);color:#4a2500;border-color:#fff3}
.chip.pts.has{animation:glowp 1s infinite}
@keyframes glowp{50%{box-shadow:0 0 16px #ffd84a}}
.mapBtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
#stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:1100px;margin:0 auto}
.scard{position:relative;border-radius:20px;padding:12px;background:linear-gradient(160deg,var(--a),var(--b));border:3px solid rgba(255,255,255,.25);box-shadow:0 8px 20px rgba(0,0,0,.4);overflow:hidden}
.scard.lock{filter:grayscale(.9) brightness(.55)}
.scard h3{margin:0 0 8px;font-family:var(--display);font-weight:400;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.scard .em{position:absolute;right:10px;top:4px;font-size:40px;opacity:.9}
.scard .bossprev{position:absolute;right:46px;top:2px;width:58px;height:58px;filter:drop-shadow(0 3px 4px #0008);animation:bob 2.4s ease-in-out infinite}
.scard.lock .bossprev{filter:brightness(0) opacity(.5)}
@keyframes bob{50%{transform:translateY(-5px)}}
.nodes{display:flex;gap:6px;align-items:center}
.node{flex:1;height:48px;border-radius:14px;font-size:18px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.node small{font-size:10px;opacity:.85;margin-top:2px}
.node.open{background:linear-gradient(#ffe57a,#ffb300);color:#4a2500;border-color:#fff;animation:glowp 1.2s infinite}
.node.done{background:rgba(70,224,176,.35);border-color:#8ff5c9}
.node.lock{opacity:.45;cursor:not-allowed}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;padding:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
#hud>*{pointer-events:auto}
.hpbox{display:flex;align-items:center;gap:4px;background:rgba(20,14,60,.78);padding:4px 10px 4px 6px;border-radius:999px;border:2px solid rgba(255,255,255,.2)}
.bar{position:relative;width:clamp(90px,18vw,180px);height:16px;border-radius:9px;background:#3a1028;overflow:hidden;border:1px solid #0006}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ff8a9a,#ff2d55);border-radius:9px;transition:width .2s}
.bar b{position:absolute;inset:0;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:400;text-shadow:0 1px 2px #000}
.rage{position:relative;width:clamp(60px,12vw,120px);height:12px;border-radius:8px;background:#2a1a10;border:2px solid rgba(255,255,255,.25);overflow:hidden}
.rage i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff9d00,#ff3d00);transition:width .2s}
.rage.full i{animation:ragef .4s infinite alternate}
@keyframes ragef{to{filter:brightness(1.6)}}
.rageW{display:flex;align-items:center;gap:4px;background:rgba(20,14,60,.78);padding:4px 10px;border-radius:999px;font-size:13px}
#hMenu{pointer-events:auto}

/* ---------- Touch controls ---------- */
#ctrl{position:absolute;inset:0;z-index:6;pointer-events:none}
#joy{position:absolute;left:calc(18px + env(safe-area-inset-left,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:clamp(120px,18vmin,170px);height:clamp(120px,18vmin,170px);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.12),rgba(255,255,255,.04));border:3px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:44%;height:44%;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#fff,#9fdcff 45%,#2f7fe0);box-shadow:0 4px 12px rgba(0,0,0,.4)}

function parseCol(s){s=String(s).trim();if(s[0]==='#'){let c=s.slice(1);if(c.length===3)c=c.split('').map(x=>x+x).join('');return [parseInt(c.substr(0,2),16),parseInt(c.substr(2,2),16),parseInt(c.substr(4,2),16)];}
 const n=s.match(/[\d.]+/g).map(Number);if(s.startsWith('rgb'))return n.slice(0,3);
 const h=n[0]/360,sa=n[1]/100,l=n[2]/100;if(!sa)return [l*255,l*255,l*255];const q=l<.5?l*(1+sa):l+sa-l*sa,p=2*l-q;const f=t=>{t=(t+1)%1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p;};return [f(h+1/3)*255,f(h)*255,f(h-1/3)*255];}

function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

 {n:'번개의',m:1.5,fx:'crit',v:12},{n:'빛의',m:1.6,fx:'heal',v:.06},{n:'영웅의',m:1.8,fx:'all',v:.1}

function item(id){const t=Math.floor(id/100),ty=Math.floor(id/10)%10,v=id%10;const T=TYPES[ty],V=VARS[v];const mul=(1+t*1.5)*V.m;
 return {id,t,ty,v,T,V,name:`${V.n} ${TIERS[t]} ${T.n}`,atk:Math.round((T.atk||0)*mul),def:Math.round((T.def||0)*mul),price:Math.round(30*(t+1)*(t+1)*(1+v*.3)),color:TC[t]};}

 const s=G.stats;let atk=5+s.str*2,def=2+Math.floor(s.vit*.5),mhp=100+s.vit*12,crit=5+s.luk,as=1+s.spd*.04,wis=s.wis,burn=0,slow=0,life=0,hpB=0,allB=0;

const In=v=>({k:'i',v});

function distract(a,spread,mist){const out=[];const used=new Set([aval(a).toFixed(6)]);let c=[];
 if(a.k==='i'){const s=spread||3;c=[a.v+1,a.v-1,a.v+s,a.v-s,a.v+2,a.v-2,a.v+10,a.v-10,a.v+s+1].map(In);}

 for(const x of c){const v=aval(x);if(!(v>=0)||!isFinite(v))continue;const key=v.toFixed(6);if(used.has(key))continue;used.add(key);out.push(x);if(out.length===2)break;}

 if(season===1)return r<.45?'rain':r<.72?'storm':'clear';
 if(season===3)return r<.7?'snow':'clear';
 return 'clear';}
function initWeather(){const th=W0.th,se=seasonOf(th);const type=rollWeather(se,th);
 W0.wx={season:se,type,k:1,next:ri(35,55),wind:0,windT:0,bolt:0,boltT:ri(4,9),snow:type==='snow'?.6:0,puddle:type==='rain'||type==='storm'?.6:0};}
function wxFall(wx){if(!wx||wx.type==='none')return null;if(wx.type==='rain'||wx.type==='storm'||wx.type==='snow')return wx.type;if(wx.season===0)return 'petal';if(wx.season===2)return 'leaf';return null;}
function wxGloom(){const wx=W0&&W0.wx;if(!wx)return 0;return (wx.type==='rain'?.45:wx.type==='storm'?.75:wx.type==='snow'?.25:0)*wx.k;}
function wxLabel(){const wx=W0&&W0.wx;if(!wx)return '';const S=SEASONS[wx.season],X=WXN[wx.type];return wx.type==='none'?`${S.e} ${S.n} · ${X[0]} ${W0.th.n.includes('바다')?'바닷속':W0.th.k==='space'?'우주':'동굴 안'}`:`${S.e} ${S.n} · ${X[0]} ${X[1]}`;}
function updWeather(dt,inBattle){const wx=W0&&W0.wx;if(!wx)return;
 if(wx.type!=='none'){wx.next-=dt;if(wx.next<=0&&wx.k>=1){const nt=rollWeather(wx.season,W0.th);wx.next=ri(35,55);if(nt!==wx.type){wx.pending=nt;}}
  if(wx.pending){wx.k=Math.max(0,wx.k-dt*.5);if(wx.k<=0){wx.type=wx.pending;wx.pending=null;}}else wx.k=Math.min(1,wx.k+dt*.5);}
 if(wx.type==='storm'){wx.windT+=dt;wx.wind=Math.sin(wx.windT*.45)*70+Math.sin(wx.windT*1.7)*20;wx.boltT-=dt;if(wx.boltT<=0){wx.bolt=1;wx.boltT=ri(5,11);wx.boltX=Math.random();tone(60,.9,'sawtooth',.06,30);tone(90,.6,'triangle',.05,40,.12);}}
 else wx.wind*=Math.max(0,1-dt*2);
 wx.bolt=Math.max(0,wx.bolt-dt*1.6);
 wx.snow=clamp(wx.snow+(wx.type==='snow'?dt*.04:-dt*.06),0,1);
 wx.puddle=clamp(wx.puddle+(wx.type==='rain'||wx.type==='storm'?dt*.08:-dt*.05),0,1);}
function wxMsg(type,season){return type==='rain'?'🌧️ 비가 내리기 시작했어요':type==='storm'?'🌀 태풍이 와요! 바람에 몸이 밀려요':type==='snow'?'❄️ 눈이 펑펑 내려요':season===0?'☀️ 날이 맑아졌어요. 봄꽃이 흩날려요':season===2?'☀️ 날이 맑아졌어요. 낙엽이 떨어져요':'☀️ 날이 맑아졌어요';}

 c.fillStyle=`rgba(52,58,76,${Math.min(1,1.1*g0)})`;for(let i=0;i<9;i++){const x=((i*170-(W0.cam||0)*.05-T*(wx.type==='storm'?40:10))%(VW+340)+VW+340)%(VW+340)-170;const y=oy+20+hash(i)*60;[[0,0,46],[-40,10,34],[40,10,38],[14,-16,32]].forEach(([a,b,r])=>{c.beginPath();c.arc(x+a,y+b,r,0,7);c.fill();});}}

function drawGroundWx(c,camX,oy){const wx=W0.wx;if(!wx)return;
 if(wx.snow>.02){c.fillStyle=`rgba(255,255,255,${.92*wx.snow})`;const draw=(x1,x2,top)=>{c.beginPath();c.moveTo(x1-3,top+2);for(let x=x1;x<=x2;x+=12)c.lineTo(x,top-3-wx.snow*4-hash(x*.3)*3*wx.snow);c.lineTo(x2+3,top+2);c.closePath();c.fill();};
  for(const s of W0.solids){const a=s.x1-camX,b=s.x2-camX;if(b<-20||a>VW+20)continue;draw(a,b,s.top+oy-4);}for(const p of W0.plats){const a=p.x1-camX,b=p.x2-camX;if(b<-20||a>VW+20)continue;draw(a,b,p.top+oy-4);}}
 if(wx.puddle>.02){for(const s of W0.solids){const a=s.x1-camX,b=s.x2-camX;if(b<-20||a>VW+20)continue;for(let x=Math.ceil(s.x1/140)*140;x<s.x2-40;x+=140){if(hash(x*.17)<.5)continue;const px=x-camX;c.fillStyle=`rgba(170,210,255,${.45*wx.puddle})`;c.beginPath();c.ellipse(px,s.top+oy+3,22*wx.puddle+6,3,0,0,7);c.fill();}}}}

function drawWeather(c,t,camX){const wx=W0&&W0.wx;if(!wx)return;const f=wxFall(wx);const k=wx.k;c.save();const gl=wxGloom();if(gl>0){c.fillStyle=`rgba(16,22,40,${gl*.3})`;c.fillRect(0,0,VW,VH);}
 if(f==='rain'||f==='storm'){const n=Math.round((f==='storm'?230:130)*k),sl=f==='storm'?.55+wx.wind*.003:.18,len=f==='storm'?26:18,spd=f==='storm'?1100:850;c.strokeStyle=f==='storm'?'rgba(215,228,250,.75)':'rgba(200,225,255,.72)';c.lineWidth=f==='storm'?2:1.5;c.beginPath();
  for(let i=0;i<n;i++){const x=((hash(i)*VW*1.5+t*spd*sl-camX*.6)%(VW+80)+VW+80)%(VW+80)-40,y=((hash(i+99)*VH+t*spd)%(VH+40))-20;c.moveTo(x,y);c.lineTo(x-sl*len,y-len);}c.stroke();
  c.fillStyle='rgba(210,230,255,.6)';for(let i=0;i<Math.round(18*k);i++){const p=(t*2.2+hash(i+7))%1,x=hash(i+31+Math.floor(t*2.2+hash(i+7)))*VW,y=VH-30-hash(i+5)*90;c.globalAlpha=1-p;c.beginPath();c.ellipse(x,y,2+p*7,1+p*2,0,0,7);c.fill();}c.globalAlpha=1;}
 else if(f==='snow'){const n=Math.round(110*k);for(let i=0;i<n;i++){const sz=1.2+hash(i+4)*2.6,sp=30+sz*14,x=((hash(i)*VW*1.5+Math.sin(t*.9+i)*28-camX*(.3+sz*.12)+t*8)%(VW+40)+VW+40)%(VW+40)-20,y=((hash(i+50)*VH+t*sp)%(VH+30))-15;
  c.fillStyle=`rgba(255,255,255,${.55+sz*.15})`;c.beginPath();c.arc(x,y,sz,0,7);c.fill();}}
 else if(f==='petal'){for(let i=0;i<Math.round(42*k);i++){const x=((hash(i)*VW*1.5+t*(26+hash(i+3)*20)+Math.sin(t*1.2+i)*30-camX*.5)%(VW+40)+VW+40)%(VW+40)-20,y=((hash(i+50)*VH+t*(32+hash(i+6)*24))%(VH+30))-15;
  c.save();c.translate(x,y);c.rotate(t*(1.5+hash(i)*2)+i);c.scale(1,.5+.5*Math.abs(Math.sin(t*3+i)));c.fillStyle=i%4?'#ffc0d8':'#fff0f6';c.beginPath();c.moveTo(0,-5);c.quadraticCurveTo(4,-2,0,5);c.quadraticCurveTo(-4,-2,0,-5);c.fill();c.restore();}}
 else if(f==='leaf'){const cols=['#e8641e','#d8401a','#f0a020','#b85a1a','#e8c040'];for(let i=0;i<Math.round(32*k);i++){const x=((hash(i)*VW*1.5+t*(22+hash(i+3)*18)+Math.sin(t*.9+i)*40-camX*.5)%(VW+50)+VW+50)%(VW+50)-25,y=((hash(i+50)*VH+t*(30+hash(i+6)*20))%(VH+40))-20;
  c.save();c.translate(x,y);c.rotate(Math.sin(t*2+i)*1.4+i);c.scale(.9+hash(i+1)*.5,.9+hash(i+1)*.5);c.fillStyle=cols[i%5];c.beginPath();for(let j=0;j<10;j++){const a=j/10*Math.PI*2-Math.PI/2,r=j%2?2.6:6.2;c.lineTo(Math.cos(a)*r,Math.sin(a)*r);}c.closePath();c.fill();c.strokeStyle='rgba(90,30,10,.6)';c.lineWidth=.7;c.beginPath();c.moveTo(0,6);c.lineTo(0,-4);c.stroke();c.restore();}}
 if(wx.type==='storm'&&k>.5){c.strokeStyle='rgba(220,230,255,.18)';c.lineWidth=2;for(let i=0;i<6;i++){const y=(hash(i)*VH+t*60)%VH,x=((t*400*(wx.wind>0?1:-1)+i*260)%(VW+300)+VW+300)%(VW+300)-150;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+60,y-10,x+120,y);c.stroke();}}
 if(wx.bolt>0){c.fillStyle=`rgba(230,240,255,${wx.bolt*.55})`;c.fillRect(0,0,VW,VH);if(wx.bolt>.6){c.strokeStyle=`rgba(255,255,230,${wx.bolt})`;c.lineWidth=3;c.shadowColor='#bcd';c.shadowBlur=20;c.beginPath();let x=VW*(.15+.7*(wx.boltX||.5)),y=0;c.moveTo(x,y);while(y<VH*.55){y+=rand(25,50);x+=rand(-25,25);c.lineTo(x,y);}c.stroke();c.shadowBlur=0;}}
 c.restore();}

function drawAmbient(c,th,t,camX){const a=th.amb,n=a==='star'?24:34;c.save();
 for(let i=0;i<n;i++){const sp=20+hash(i)*40,ph=hash(i+50);let x,y;
  if(['bubble','ember','firefly','star','pollen','sparkle','wisp'].includes(a)){x=((hash(i+9)*VW*1.6-camX*(.3+hash(i)*.5)+Math.sin(t+i)*20)%VW+VW)%VW;y=VH-((t*sp+ph*VH)%(VH+40));}
  else{x=((hash(i+9)*VW*1.6-camX*(.3+hash(i)*.5)+t*sp*.6+Math.sin(t*1.3+i)*24)%VW+VW)%VW;y=((t*sp+ph*VH)%(VH+40))-20;}
  if(a==='pollen'){c.fillStyle=`rgba(255,250,200,${.35+.35*Math.sin(t*2+i)})`;c.beginPath();c.arc(x+Math.sin(t+i)*8,y,1.3,0,7);c.fill();}
  else if(a==='sparkle'){const p=Math.max(0,Math.sin(t*3+i*1.3));c.fillStyle=`rgba(230,250,255,${p*.85})`;c.save();c.translate(x,y);c.rotate(Math.PI/4);c.fillRect(-.7,-3.5*p,1.4,7*p);c.fillRect(-3.5*p,-.7,7*p,1.4);c.restore();}
  else if(a==='wisp'){c.fillStyle=`rgba(200,120,255,${.25+.25*Math.sin(t*2+i)})`;c.beginPath();c.arc(x+Math.sin(t*1.5+i)*10,y,2+hash(i)*2,0,7);c.fill();}
  else if(a==='petal'){c.fillStyle=i%3?'rgba(255,170,200,.85)':'rgba(255,255,255,.85)';c.save();c.translate(x,y);c.rotate(t*2+i);ell(c,0,0,3.5,1.8);c.fill();c.restore();}
  else if(a==='firefly'){const p=.5+.5*Math.sin(t*4+i*1.7);c.fillStyle=`rgba(220,255,120,${p})`;c.shadowColor='#dfff7a';c.shadowBlur=8;circ(c,x,y,1.8);c.fill();c.shadowBlur=0;}
  else if(a==='leaf'){c.fillStyle=i%2?'rgba(140,190,70,.85)':'rgba(200,150,60,.85)';c.save();c.translate(x,y);c.rotate(t*3+i);ell(c,0,0,4,2);c.fill();c.restore();}
  else if(a==='dust'){c.fillStyle=`rgba(200,190,255,${.25+.25*Math.sin(t+i)})`;circ(c,x,y,1.4);c.fill();}
  else if(a==='bubble'){c.strokeStyle='rgba(220,250,255,.7)';c.lineWidth=1;circ(c,x+Math.sin(t*3+i)*4,y,2+hash(i+3)*4);c.stroke();c.fillStyle='rgba(255,255,255,.6)';circ(c,x-1+Math.sin(t*3+i)*4,y-1,.8);c.fill();}
  else if(a==='snow'){c.fillStyle='rgba(255,255,255,.9)';circ(c,x,y,1.2+hash(i+4)*2);c.fill();}
  else if(a==='feather'){c.fillStyle='rgba(255,255,255,.9)';c.save();c.translate(x,y);c.rotate(Math.sin(t*2+i)*.8);ell(c,0,0,5,1.6);c.fill();c.restore();}
  else if(a==='ember'){const p=hash(i+5);c.fillStyle=`rgba(255,${120+p*120},40,${.5+.5*Math.sin(t*6+i)})`;c.shadowColor='#ff7a00';c.shadowBlur=6;circ(c,x,y,1.2+p*1.8);c.fill();c.shadowBlur=0;}
  else if(a==='star'){c.fillStyle=`hsla(${i*40},90%,80%,${.5+.5*Math.sin(t*5+i)})`;c.save();c.translate(x,y);c.rotate(t+i);c.fillRect(-2.5,-.5,5,1);c.fillRect(-.5,-2.5,1,5);c.restore();}
  else if(a==='ash'){c.fillStyle=`rgba(${i%4?'120,100,120':'255,90,90'},.6)`;circ(c,x,y,1.3);c.fill();}}
 c.restore();
 if(th.k==='cave'){const g=c.createRadialGradient(VW/2,VH/2,VH*.25,VW/2,VH/2,VH*.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.45)');c.fillStyle=g;c.fillRect(0,0,VW,VH);}
 if(th.k==='sea'){c.fillStyle='rgba(20,90,160,.12)';c.fillRect(0,0,VW,VH);}}

function burst(arr,x,y,n,cols,spd,grav){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=rand(.3,1)*(spd||200);arr.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-(spd||200)*.3,life:rand(.4,.9),max:.9,col:pick(cols),r:rand(2,5),g:grav==null?500:grav});}}
function updParts(arr,dt){for(let i=arr.length-1;i>=0;i--){const p=arr[i];p.life-=dt;if(p.life<=0){arr.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;}}

  const d=AC.createDelay(1),fb=AC.createGain(),wet=AC.createGain();d.delayTime.value=60/TRACKS.calm.bpm*.75;fb.gain.value=.32;wet.gain.value=.28;d.connect(fb);fb.connect(d);d.connect(wet);wet.connect(MUS.master);MUS.echo=d;
  const len=AC.sampleRate*.2,buf=AC.createBuffer(1,len,AC.sampleRate),dd=buf.getChannelData(0);for(let i=0;i<len;i++)dd[i]=Math.random()*2-1;MUS.noise=buf;}}catch(e){}}
function mOsc(type,f,t0,dur,vol,echo,atk){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+(atk||.01));g.gain.exponentialRampToValueAtTime(.0005,t0+dur);o.connect(g);g.connect(MUS.master);if(echo&&MUS.echo)g.connect(MUS.echo);o.start(t0);o.stop(t0+dur+.05);}
function mNoise(t0,dur,vol,freq){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=MUS.noise;f.type='highpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0005,t0+dur);s.connect(f);f.connect(g);g.connect(MUS.master);s.start(t0);s.stop(t0+dur+.02);}
function musStep(tr,st,t0,spb){const bar=Math.floor(st/8)%tr.roots.length,b8=st%8;
 for(const e of tr.ev)if(e.s===st){const d=spb*e.len+spb*1.2;mOsc('triangle',e.f,t0,d,.07,true,.02);mOsc('sine',e.f*2,t0,d*.7,.018,true,.02);}
 const r=tr.roots[bar];if(b8===0)mOsc('sine',r,t0,spb*7.5,.12,false,.04);if(b8===4)mOsc('sine',r*1.5,t0,spb*3.5,.06,false,.04);
 const ch=CHORD[tr.ch[bar]]||CHORD.C,base=noteF('C5');const arp=[0,1,2,1,0,1,2,1][b8];mOsc('sine',base*Math.pow(2,ch[arp]/12),t0,spb*1.6,.022,true,.005);
 if(b8%2===1)mNoise(t0,.05,.012,6500);}
function musTick(){if(!AC||!MUS.master)return;const on=G.set&&G.set.music!==0;
 if(!on){MUS.cur=null;return;}
 if(MUS.cur!==MUS.want){MUS.cur=MUS.want;MUS.step=0;MUS.next=Math.max(AC.currentTime+.06,MUS.next);}
 const tr=TRACKS[MUS.cur],spb=60/tr.bpm/2;if(MUS.next<AC.currentTime-.3)MUS.next=AC.currentTime+.05;
 while(MUS.next<AC.currentTime+.2){musStep(tr,MUS.step,MUS.next,spb);MUS.next+=spb;MUS.step=(MUS.step+1)%tr.len;}}
function musPick(){MUS.want='calm';}
setInterval(()=>{try{musPick();musTick();}catch(e){}},30);
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,()=>{musEnsure();},{passive:true}));

let T=0,last=performance.now(),hudT=0;
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;
 if(!(SC>0&&VW>0&&VH>0&&isFinite(VW)&&isFinite(VH))){requestAnimationFrame(loop);return;}
 ctx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
 try{
  if(mode==='title'||mode==='map')drawTitle(ctx,T);
  else if(mode==='play'&&W0){if(!paused&&!rotBlock)updWorld(dt);else{updParts(W0.parts,dt);updTexts(W0.texts,dt);}drawWorld(ctx,T);}
  else if(mode==='battle'&&B){if(!paused&&!rotBlock)updBattle(dt);drawBattle(ctx,T);}
 }catch(e){console.error(e);}
 hudT+=dt;if(hudT>.1){hudT=0;updHUD();}
 requestAnimationFrame(loop);}
load();calc();applySettings();buildTitle();requestAnimationFrame(loop);
</script>
